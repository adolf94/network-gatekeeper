; supervisord for the gatekeeper-core container (CONTAINER.md Phase 3).
; dnsmasq and the doorbell are surgery-coupled (same conf, same leasefile,
; live signal path), so they live in one container; the portal stays in its
; own, least-privileged container (compose overrides the command there).
;
; Environment (TOKEN, IFACE, DNMSQ_*, LOG_*, ...) is inherited from the
; container env — compose sets it; the scripts read it via os.environ.

[unix_http_server]
file=/run/supervisor-core.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord-core.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor-core.sock

[program:dnsmasq]
; DHCP+DNS gate. --user=root: the mounted leasefile dir is root-owned and
; dropping privileges would lose the container's NET_ADMIN/NET_RAW caps.
; Paths match the compose mounts exactly.
command=/usr/sbin/dnsmasq --keep-in-foreground --user=root
    --conf-file=/etc/dnsmasq.d/gatekeeper.conf
    --log-facility=/var/log/gatekeeper/dnsmasq.log
priority=10
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:doorbell]
command=/usr/bin/python3 /opt/doorbell/doorbell.py
priority=20
autorestart=true
startsecs=2
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
